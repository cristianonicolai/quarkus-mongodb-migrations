# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit reviews pull requests on this repository. Public repositories get the open-source plan automatically.
language: en-US
tone_instructions: "Be direct and concise. Prioritize correctness, concurrency and data-safety issues over style. Skip praise and restating the diff."

reviews:
  profile: chill
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
    # Dependency bumps are covered by CI; a review can still be requested with "@coderabbitai review".
    ignore_usernames:
      - "dependabot[bot]"
  path_filters:
    # Generated by the Quarkus config doc plugin during the build.
    - "!docs/modules/ROOT/pages/includes/**"
    - "!**/target/**"
  pre_merge_checks:
    # Public API is documented; requiring docstrings on private helpers and JavaScript methods only adds noise.
    docstrings:
      mode: "off"
  path_instructions:
    - path: "**/*.java"
      instructions: |
        This is a Quarkus extension (Quarkiverse layout) for running MongoDB migrations written in Java.
        - The bytecode level is Java 17 on purpose, to match Quarkus's minimum. Do not suggest raising it or using
          newer language features.
        - Prefer static imports for static helpers (JUnit assertions, Hamcrest matchers, MongoDB Filters/Updates/
          Indexes/Sorts) over class-qualified calls.
        - Prefer the MongoDB driver builders (Filters, Updates, Aggregates, Indexes, Sorts) over hand-built
          org.bson.Document queries. Aggregation expressions such as $$NOW, $cond, $ifNull and $literal have no stable
          driver builder and belong in runtime/Expressions.java.
        - Do not suggest new dependencies.
    - path: "runtime/src/main/java/io/quarkiverse/mongodb/migrations/*.java"
      instructions: |
        Public API used by applications (@Migration, MongoMigration, ReactiveMongoMigration, MongoMigrator, the
        helpers). Flag source or behavior incompatibilities, missing or inaccurate Javadoc, and helpers that are not
        idempotent: the collection, index, field and array helpers must be safe to run twice. updateMany, deleteMany,
        updateEach and writeEach run the updates and writes they are given, so their author makes those safe to repeat;
        flag them only when their documentation stops saying so.
    - path: "runtime/src/main/java/io/quarkiverse/mongodb/migrations/runtime/MigrationLock.java"
      instructions: |
        Lease-based lock in a single MongoDB document; review with care for races between instances.
        - Times must come from the server clock ($$NOW), never the JVM clock, so instances with skewed clocks agree.
        - The owner token is a random UUID per lock and decides ownership. instanceId is for diagnostics only and may
          be shared by several instances; it must never be used to decide who holds the lock.
        - MongoDB rejects $expr in an upsert filter, which is why the "held by someone else" check lives in the update
          pipeline. Values from config or class names must be wrapped in $literal inside pipelines.
        - Check renewal, expiry takeover, and release (which must only delete our own lock).
    - path: "runtime/src/main/java/io/quarkiverse/mongodb/migrations/runtime/**"
      instructions: |
        Internal runtime: the run loop (MongoMigratorImpl), history writes and failure log (FailureLog).
        - A migration is identified by its id; class name and order in the history are informational and kept in sync.
        - Only the failed migration is rolled back. Rollback and failure-log errors must never hide the original
          migration failure. Errors propagate unwrapped after rollback and recording.
        - migrate() can be called from any thread, so it must not rely on the caller's context class loader.
    - path: "deployment/src/main/java/**"
      instructions: |
        Build-time processing. Check that build steps only use build-time information, that runtime work goes
        through the recorder, that everything needed in native mode is registered, and that invalid migrations fail
        the build with a clear message.
    - path: "**/src/test/java/**"
      instructions: |
        Tests run against a real MongoDB started by Quarkus Dev Services. Flag timing assumptions that could make a
        test flaky, tests that depend on execution order, and assertions that would still pass if the feature broke.
    - path: ".github/workflows/**"
      instructions: |
        Actions maintained outside Quarkiverse are pinned to a commit SHA with the version in a comment, updated by
        Dependabot. The quarkiverse/.github shared workflows intentionally stay on @main, matching the Quarkiverse
        template; do not suggest pinning them.

chat:
  auto_reply: true
