name: Build

on:
  push:
    branches:
      - "main"
    paths-ignore:
      - '.gitignore'
      - 'CODEOWNERS'
      - 'LICENSE'
      - '*.md'
      - '*.adoc'
      - '*.txt'
      - '.all-contributorsrc'
      - '.coderabbit.yaml'
      - '.github/project.yml'
  pull_request:
    paths-ignore:
      - '.gitignore'
      - 'CODEOWNERS'
      - 'LICENSE'
      - '*.md'
      - '*.adoc'
      - '*.txt'
      - '.all-contributorsrc'
      - '.coderabbit.yaml'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build on ${{ matrix.os }} with MongoDB ${{ matrix.mongodb }}
    strategy:
      fail-fast: false
      matrix:
#        os: [windows-latest, macos-latest, ubuntu-latest]
        # Not ubuntu-latest for now: MongoDB 8 refuses to start on its kernel (6.19 to 7.0.13 are incompatible, see
        # https://jira.mongodb.org/browse/SERVER-121912). Move back once the ubuntu-24.04 runner has kernel 7.0.14+.
        os: [ubuntu-22.04]
        # The MongoDB versions still supported by MongoDB. 7.0 reaches end of life on 2027-08-31.
        mongodb: ['8.0', '7.0']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Prepare git
        run: git config --global core.autocrlf false
        if: startsWith(matrix.os, 'windows')

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
          cache: 'maven'

      - name: Build with Maven
        run: mvn -B clean install -Dno-format -Dmongodb.image=mongo:${{ matrix.mongodb }}
