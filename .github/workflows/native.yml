name: Native Tests
run-name: Native tests on ${{ github.ref_name }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  native-tests:
    name: Native tests
    # Not ubuntu-latest for now, like the Build workflow: MongoDB 8 refuses to start on its kernel (SERVER-121912).
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      # The branch picked when the workflow was run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
          cache: 'maven'

      # Builds the native executable with the Mandrel builder image and runs the integration tests against it. The JVM
      # tests of the integration tests are skipped; the Build workflow runs them.
      - name: Build and test native executable
        run: mvn -B install -Dnative -Dquarkus.native.container-build -Dnative.surefire.skip
